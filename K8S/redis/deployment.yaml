apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
     
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: docker0.azurecr.io/redis:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
      resources:
        requests:
          memory: "128Mi"
          cpu: "250m"
        limits:
          memory: "256Mi"
          cpu: "500m"
        