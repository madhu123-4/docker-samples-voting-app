apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: voting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: docker0.azurecr.io/redis:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
