apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.fullname" . }}-vote
  labels:
    {{- include "voting-app.componentLabels" (dict "root" . "component" "vote") | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicaCount }}
  selector:
    matchLabels:
      {{- include "voting-app.componentLabels" (dict "root" . "component" "vote") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.componentLabels" (dict "root" . "component" "vote") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vote
          image: "{{ .Values.vote.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.vote.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vote.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "voting-app.fullname" . }}-vote
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "voting-app.fullname" . }}-vote
  labels:
    {{- include "voting-app.componentLabels" (dict "root" . "component" "vote") | nindent 4 }}
spec:
  type: {{ .Values.vote.service.type }}
  selector:
    {{- include "voting-app.componentLabels" (dict "root" . "component" "vote") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.vote.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.fullname" . }}-result
  labels:
    {{- include "voting-app.componentLabels" (dict "root" . "component" "result") | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicaCount }}
  selector:
    matchLabels:
      {{- include "voting-app.componentLabels" (dict "root" . "component" "result") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.componentLabels" (dict "root" . "component" "result") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: result
          image: "{{ .Values.result.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.result.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.result.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "voting-app.fullname" . }}-database-clients
